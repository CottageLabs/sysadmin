# Install or update an existing load balancer's htpasswd and origin certificates from AWS Secrets Manager.
# create_lb_server.yml does this for new load balancers; use this for an existing one or after rotating a certificate.
#
# To also switch its doaj-app profile over to the doaj-loadbalancer IAM user's keys (needed once, as those can
# read the doaj/loadbalancer secret and doaj-apps can't), pass a credentials file with those keys in [doaj-app]:
#   ansible-playbook -i ../doaj-hosts.ini install_lb_secrets.yml -e @aws_creds_from_file.yml -e aws_creds_file=/path/to/doaj-lb/.aws/credentials
---
- name: Install load balancer secrets
  hosts: "{{ target if target is defined and target | length > 0 else 'loadbalancer' }}"
  gather_facts: false

  tasks:
    - name: Switch the doaj-app profile to the doaj-loadbalancer IAM user's keys
      community.general.ini_file:
        path: "/home/{{ ansible_user }}/.aws/credentials"
        section: doaj-app
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        mode: '0600'
      loop:
        - { option: aws_access_key_id, value: "{{ aws_access_key }}" }
        - { option: aws_secret_access_key, value: "{{ aws_secret_key }}" }
      no_log: true
      when: aws_creds_file is defined

    - name: Install htpasswd and certificates
      include_tasks: tasks/lb_secrets.yml

    - name: Check the nginx config
      become: yes
      command: nginx -t
      changed_when: false

    - name: Reload nginx if the certificates changed
      become: yes
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
      when: lb_cert_files is changed
