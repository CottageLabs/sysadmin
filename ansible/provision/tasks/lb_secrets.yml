# Install the load balancer's secrets: nginx basic auth and the Cloudflare Origin CA certificates.
# They're read from the doaj/loadbalancer secret in AWS Secrets Manager by the load balancer itself, using its
# doaj-app profile - on the load balancer that holds the doaj-loadbalancer IAM user's keys rather than doaj-apps.
# The secret is JSON with the keys: htpasswd, doaj_org_cert, doaj_org_key, doajes_cert, doajes_key

- name: Note in the credentials file that doaj-app is a different identity on this machine
  lineinfile:
    path: "/home/{{ ansible_user }}/.aws/credentials"
    insertbefore: '^\[doaj-app\]'
    line: "# On the load balancer, doaj-app is the doaj-loadbalancer IAM user: different credentials performing the same role as on the app servers (deploy.sh reading app.cfg), which can also read the doaj/loadbalancer secret for nginx"

- name: Read the load balancer secrets from AWS Secrets Manager
  command: >
    /home/{{ ansible_user }}/doaj/venv/bin/aws --profile doaj-app --region eu-west-2
    secretsmanager get-secret-value --secret-id {{ lb_secret_id | default('doaj/loadbalancer') }}
    --query SecretString --output text
  changed_when: false
  no_log: true
  register: lb_secret_raw

- name: Parse the secrets
  set_fact:
    lb_secrets: "{{ lb_secret_raw.stdout | from_json }}"
  no_log: true

- name: Ensure the nginx ssl directory exists
  become: yes
  file:
    path: /etc/nginx/ssl
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Write the htpasswd file for nginx basic auth
  become: yes
  copy:
    content: "{{ lb_secrets.htpasswd | trim }}\n"
    dest: /etc/nginx/htpasswd
    owner: root
    group: root
    mode: '0644'
  no_log: true

- name: Write the origin certificates and keys
  become: yes
  copy:
    content: "{{ lb_secrets[item.key] | trim }}\n"
    dest: "/etc/nginx/ssl/{{ item.file }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { key: doaj_org_cert, file: doaj.org.pem, mode: '0644' }
    - { key: doaj_org_key, file: doaj.org.key, mode: '0600' }
    - { key: doajes_cert, file: doajes.cottagelabs.com.pem, mode: '0644' }
    - { key: doajes_key, file: doajes.cottagelabs.com.key, mode: '0600' }
  loop_control:
    label: "{{ item.file }}"
  no_log: true
  register: lb_cert_files
