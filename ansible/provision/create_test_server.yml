#
# ansible-playbook create_test_server.yml --e "droplet_name=<name> git_branch=<git branch> aws_profile=doaj-test aws_access_key=<key> aws_secret_key=<key>" --private-key=~/.ssh/id_rsa -vv
#
---
- name: Bring up a new DOAJ test server
  hosts: localhost
  connection: local
  gather_facts: true

  roles:
    - role: install_roles

  vars:
    digitalocean_token: "{{ lookup('ansible.builtin.env', 'DIGITALOCEAN_TOKEN') }}"
    server_config: "{{ lookup('ansible.builtin.file', '../../cloud-init_userdata/doaj-test_cloud-config.txt') }}"
    droplet_name: test1
    droplet_size: s-4vcpu-8gb
    droplet_tags:
      - doaj-test
      - firewall-web-ssh
    dns_prefix: '{{ droplet_name }}'
    dns_domain: doaj.cottagelabs.com
    skip_latest_dns: false

  tasks:

    - name: Create the droplet and its DNS record
      include_tasks: tasks/create_droplet.yml

    - name: Find correct CNAME for latest.{{ dns_domain }}
      digitalocean.cloud.domain_records_info:
        token: "{{ digitalocean_token }}"
        domain_name: '{{ dns_domain }}'
        type: CNAME
      register: cname_info
      when: not skip_latest_dns | bool

    - name: Delete existing latest.{{ dns_domain }} CNAME record to re-create it for this machine
      digitalocean.cloud.domain_record:
        token: "{{ digitalocean_token }}"
        domain_name: '{{ dns_domain }}'
        type: CNAME
        name: latest
        data: "{{ cname_info['domain_records'][0]['data'] }}"
        state: absent
      when: not skip_latest_dns | bool and cname_info['domain_records'] | length > 0

    - name: Re-apply latest.{{ dns_domain }} CNAME record to point to this VM at {{ dns_prefix }}.{{ dns_domain }}
      digitalocean.cloud.domain_record:
        token: "{{ digitalocean_token }}"
        domain_name: '{{ dns_domain }}'
        type: CNAME
        name: latest
        data: "{{ dns_prefix }}."
        ttl: 600
      when: not skip_latest_dns | bool

    - set_fact:
        remote_host_name: "{{ droplet_name }}"

    - add_host:
        name: "{{ public_ip }}"
        groups: test_servers

    - set_fact:
        login_command: "ssh cloo@{{dns_prefix}}.{{dns_domain}}"

    - name: Give 7 minutes for the server to be up
      pause:
        minutes: 7

- name: Run initial setup
  import_playbook: server_initial_setup.yml
  vars:
    target: "{{ hostvars.localhost.public_ip }}"
    server_name: "{{ hostvars.localhost.remote_host_name }}"
    ansible_user: "cloo"
    install_index: true
    git_branch: "master"

- name: Give a minute for the app to stabilise
  hosts: localhost
  tasks:
    - name: Waiting...
      pause:
        minutes: 1

- name: Import Test data
  import_playbook: import_test_data.yml
  vars:
    target: "{{ hostvars.localhost.public_ip }}"
    ansible_user: "cloo"

- name: Output a login command for immediate use
  hosts: localhost
  tasks:
    - name: Login command for {{ hostvars.localhost.remote_host_name }}
      ansible.builtin.debug:
        msg: "Test server created: {{ hostvars.localhost.login_command }}"
