# Set up Redis in production for access from other machines (on the background server)
# NOTE: Firewall isn't handled here. It should be set in DO or the provision script.

## ansible-playbook -i ../doaj-hosts.ini redis_setup.yml --limit "doaj-background-1"
---

- name: Setup Redis for common access from app servers
  hosts: background
  become: true
  gather_facts: yes

  tasks:
    - name: Debug hostname
      debug:
        msg: "Configuring redis on host {{ inventory_hostname }} with internal IP {{ ansible_facts.eth1.ipv4.address }}"
    
    - name: Ensure redis is installed
      apt:
        name:
          - redis
        state: present
        update_cache: yes

    - name: Edit the redis config to expose redis over eth1
      lineinfile: 
        dest: /etc/redis/redis.conf
        regexp: '^bind\s+'
        line: "bind {{ ansible_facts.eth1.ipv4.address }} 127.0.0.1 ::1"
        state: present
        backup: yes
        backrefs: yes
      register: bind_updated

    # Redis 7 (Ubuntu 24.04) applies protected mode even with an explicit bind, so with no password it refuses every
    # non-local connection and the app servers and huey can't reach it. Access is limited by the bind above and the
    # doaj-redis DigitalOcean firewall (port 6379 from tag firewall-doaj-app only).
    - name: Turn off protected mode so app servers can connect over eth1
      lineinfile:
        dest: /etc/redis/redis.conf
        regexp: '^protected-mode\s+'
        line: "protected-mode no"
        state: present
        backup: yes
      register: protected_mode_updated

    - name: Restart redis with the new configuration if necessary
      ansible.builtin.service:
        name: redis-server
        state: restarted
      when: bind_updated is changed or protected_mode_updated is changed

